plugins {
    id 'com.android.application'
}

android {
    namespace 'com.premiumlab.galleryx'
    compileSdk 37

    defaultConfig {
        applicationId "tkm.tmgallery.pro"
        minSdk 26
        targetSdk 37
        versionCode 53
        versionName "3.33.0"
    }

    buildTypes {
        // Отладочная сборка: видна в Android Studio (Build Variants → debug),
        // ставится рядом с релизом не мешая ему, без сжатия — быстрая сборка.
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            // Обфускация R8 по умолчанию ВЫКЛЮЧЕНА. Чтобы включить защиту кода,
            // поменяйте обе строки ниже на true — правила уже готовы в proguard-rules.pro.
            minifyEnabled false
            shrinkResources false // работает только вместе с minifyEnabled true
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    // Видеоредактор: перекодирование с эффектами (кадр, фильтр, скорость, громкость)
    implementation 'androidx.media3:media3-transformer:1.4.1'
    implementation 'androidx.media3:media3-effect:1.4.1'
    implementation 'androidx.media3:media3-common:1.4.1'
}
